<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="todo-app">
        <h1>Todo List</h1>
        
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Add a todo...">
            <input type="date" id="date-input">
            <button type="submit" class="add-btn">+</button>
        </form>
        
        <div class="controls">
            <button id="filter-btn">Filter Incomplete</button>
            <button id="delete-all-btn">Delete All</button>
        </div>
        
        <div class="todo-list-container">
            <div class="todo-header">
                <div class="task-col">TASK</div>
                <div class="date-col">DUE DATE</div>
                <div class="status-col">STATUS</div>
                <div class="actions-col">ACTIONS</div>
            </div>
            <div id="todo-list">
                <p class="no-task-message">No task found</p>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
